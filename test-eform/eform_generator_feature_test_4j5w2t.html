<script>
// Points a page's background image at its file: in OSCAR's image folder once the eForm is in
// OSCAR (opened over http), or beside the eForm's HTML when it is opened from disk
function changeImage(img, imgId){
  var bg = document.getElementById(imgId);
  if (bg) bg.src = resourceLink(img);
}
// A file's address: "${oscar_image_path}page1.png" in OSCAR, "page1.png" opened from disk
function resourceLink(resource){
  var prefix = (window.location.href.toLowerCase().indexOf('http') != -1) ? '${oscar_image_path}' : '';
  return prefix + resource;
}
</script>

<script>
// Fields shown by a choice: ticking a "parent-field" shows the fields of class "child-<its id>"
// (or "child-<its value>"); of the boxes sharing an "only-one-…" class, only one stays ticked
$(document).ready(function() {
  $('[class^="child-"]').hide();
  $('.parent-field').click(function() {
    $('[class^="child-"]').hide();
    $('.parent-field').each(function() {
      if ($(this).is('input:checkbox')) {
        if (this.checked) $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
      if ($(this).is('input:text')) {
        if ($(this).val() === 'X') $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
    });
  });
  $('[class^="only-one-"]').click(function() {
    if ($(this).is('input:checkbox')) {
      $('.' + $(this).attr('class')).prop('checked', false);
      $(this).prop('checked', true);
    }
    if ($(this).is('input:text')) {
      $('.' + $(this).attr('class')).val('');
      $(this).val('X');
    }
  });
});
</script>

<script>
// "Print & Submit": prints the form
function formPrint(){ try{ window.print(); }catch(e){} }

// Typing in the form marks it changed, so leaving asks first; submitting clears that
var needToConfirm = false;
document.onkeyup = setDirtyFlag;
function setDirtyFlag(){ needToConfirm = true; }
function releaseDirtyFlag(){ needToConfirm = false; }
window.onbeforeunload = confirmExit;
// The warning shown on leaving a changed form
function confirmExit(){
  if (needToConfirm){
    return "You have attempted to leave this page. If you have made any changes to the fields without clicking the Save button, your changes will be lost. Are you sure you want to exit this page?";
  }
}
// (OSCAR's own functions that startup() calls, where this OSCAR doesn't have them: they do nothing)
if (typeof window.setFaxNo !== 'function') window.setFaxNo = function(){};
if (typeof window.checkGender !== 'function') window.checkGender = function(){};
if (typeof window.loadSig !== 'function') window.loadSig = function(){};

// Shows the current provider's signature image in each page's signature stamp ("signature",
// "signature2"…; hidden where they have none)
function SignForm() {
  try {

    }

}

<script>
// Font size buttons: makes a textarea's text bigger or smaller by delta px, and keeps the size in
// its hidden "<name>_fontsize" input so it is saved with the form
function changeFontSize(name, delta){
  var box = document.getElementsByName(name)[0], saved = document.getElementsByName(name + '_fontsize')[0];
  if (!box) return;
  var size = Math.max(6, (parseInt(window.getComputedStyle(box).fontSize, 10) || 12) + delta);
  box.style.fontSize = size + 'px';
  if (saved){ saved.value = size; saved.setAttribute('value', size); }
  if (typeof setDirtyFlag === 'function') setDirtyFlag();
}
// On load: gives each textarea back the font size saved with the form
function loadFontSize(){
  var saved = document.querySelectorAll("input[name$='_fontsize']");
  for (var i = 0; i < saved.length; i++){
    if (!saved[i].value) continue;
    var box = document.getElementsByName(saved[i].name.slice(0, -'_fontsize'.length))[0];
    if (box) box.style.fontSize = saved[i].value + 'px';
  }
}
</script>
<script>
// Whether the form is new (not opened again after it was saved)
function isNewForm(){
  var flag = document.getElementById('newForm');
  return !!flag && flag.value === 'True';
}
// Marks the form saved, so the next time it opens what it was saved with stays
function markFormSaved(){
  var flag = document.getElementById('newForm');
  if (flag){ flag.value = 'False'; flag.setAttribute('value', 'False'); }
}
document.addEventListener('DOMContentLoaded', function(){
  var form = document.getElementById('FormName');
  if (form) form.addEventListener('submit', markFormSaved);
});
</script>
<script>
// On a new form, ticks each box for the patient's sex (data-tick-if-sex="M" or "F"), from the
// hidden PatientGender field that OSCAR fills
function tickSexBoxes(){
  var sexField = document.getElementById('PatientGender');
  if (!isNewForm() || !sexField) return;
  var sex = String(sexField.value || '').trim().toUpperCase();
  var boxes = document.querySelectorAll('[data-tick-if-sex]');
  for (var i = 0; i < boxes.length; i++){
    if (sex && boxes[i].getAttribute('data-tick-if-sex') === sex) boxes[i].value = 'X';
  }
}
</script>
<script>
// The patient's phone of a kind ("home", "cell" or "work"), from the hidden fields OSCAR fills
function patientPhone(kind){
  var field = document.getElementById({ home: 'PatientPhoneHome', cell: 'PatientPhoneCell', work: 'PatientPhoneWork' }[kind]);
  return field ? String(field.value || '').trim() : '';
}
</script>
<script>
// On a new form, each field showing the current user's name (data-user-name="last", "first" or
// "first last") shows that part of it, from the hidden CurrentUserName field that OSCAR fills
// with "Last, First"
function fillUserNames(){
  var nameField = document.getElementById('CurrentUserName');
  if (!isNewForm() || !nameField) return;
  var parts = String(nameField.value || '').split(','), last = (parts[0] || '').trim(), first = (parts[1] || '').trim();
  var names = { 'last': last, 'first': first, 'first last': (first + ' ' + last).trim() };
  var fields = document.querySelectorAll('[data-user-name]');
  for (var i = 0; i < fields.length; i++) fields[i].value = names[fields[i].getAttribute('data-user-name')] || '';
}
</script>
<script>
// On a new form, each field showing today's date (data-today-format="dmy" or "ymd") shows it in
// that format: "29-01-2016", or "2016-01-29" as OSCAR's "today" tag fills it
function fillTodayDates(){
  if (!isNewForm()) return;
  var now = new Date(), two = function(n){ return (n < 10 ? '0' : '') + n; };
  var day = two(now.getDate()), month = two(now.getMonth() + 1), year = now.getFullYear();
  var dates = { 'dmy': day + '-' + month + '-' + year, 'ymd': year + '-' + month + '-' + day };
  var fields = document.querySelectorAll('[data-today-format]');
  for (var i = 0; i < fields.length; i++) fields[i].value = dates[fields[i].getAttribute('data-today-format')] || '';
}
</script>
<script>
// On a new form, each field listing phones (data-show-phones="home cell") shows the patient's
// phones of those kinds: "(H): 604-555-0100. (C): 778-555-0199." (a kind they have none of is
// left out)
function fillPhoneLists(){
  if (!isNewForm()) return;
  var fields = document.querySelectorAll('[data-show-phones]');
  for (var i = 0; i < fields.length; i++){
    var kinds = fields[i].getAttribute('data-show-phones').split(' '), parts = [];
    for (var j = 0; j < kinds.length; j++){
      var number = patientPhone(kinds[j]);
      if (number) parts.push('(' + kinds[j].charAt(0).toUpperCase() + '): ' + number + '.');
    }
    fields[i].value = parts.join(' ');
  }
}
</script>
<script>
// Writes the patient's phone of a kind in the field called `name`: "604-555-0100, cell", or
// nothing when they have no phone of that kind
function writePhone(name, kind){
  var box = document.getElementsByName(name)[0];
  if (!box || !kind) return;
  var number = patientPhone(kind);
  box.value = number ? number + ', ' + kind : '';
}
// A phone selector's choice: writes that phone in its field
function choosePhone(name, kind){
  writePhone(name, kind);
  if (typeof setDirtyFlag === 'function') setDirtyFlag();
}
// On a new form, each phone field shows the patient's first phone of home, cell and work, and
// its selector says which
function fillDefaultPhones(){
  if (!isNewForm()) return;
  var kinds = ['home', 'cell', 'work'], kind = 'home';
  for (var i = 0; i < kinds.length; i++){ if (patientPhone(kinds[i])){ kind = kinds[i]; break; } }
  var selectors = document.querySelectorAll('select[data-phone-for]');
  for (var j = 0; j < selectors.length; j++){
    selectors[j].value = kind;
    writePhone(selectors[j].getAttribute('data-phone-for'), kind);
  }
}
</script>

<script>
// Free draw areas: each .FreeDraw canvas is drawn on with a mouse, pen or finger, and what is
// drawn is kept in its hidden input (data-draw-for), so OSCAR saves it with the form and it is
// drawn again when the form opens. A stroke is kept as its pen colour and its points, in the
// area's pixels: "#000000|10,20 14,26;#d00000|…". Its toolbar (data-draw-tools-for) chooses the
// pen, takes back the last stroke (Undo) or all of them (Clear).
function setUpFreeDraw(){
  var areas = document.querySelectorAll('.FreeDraw');
  for (var i = 0; i < areas.length; i++) setUpFreeDrawArea(areas[i]);
}
// Sets up one free draw area: its canvas, its saved strokes and its toolbar
function setUpFreeDrawArea(area){
  var name = area.getAttribute('data-draw-for'), store = document.getElementsByName(name)[0];
  var canvas = area.getElementsByTagName('canvas')[0];
  if (!store || !canvas || !canvas.getContext) return;
  // (twice the area's size, so it prints sharp)
  var width = area.offsetWidth, height = area.offsetHeight, sharpness = 2;
  canvas.width = width * sharpness; canvas.height = height * sharpness;
  var context = canvas.getContext('2d');
  context.scale(sharpness, sharpness); context.lineWidth = 2; context.lineCap = 'round'; context.lineJoin = 'round';
  var strokes = readStrokes(store.value), stroke = null, pen = '#000000';
  // Draws one stroke: a dot for a single point, else a line through its points
  function drawStroke(s){
    context.strokeStyle = s.color; context.fillStyle = s.color;
    if (s.points.length === 1){ context.beginPath(); context.arc(s.points[0][0], s.points[0][1], 1.2, 0, 2 * Math.PI); context.fill(); return; }
    context.beginPath(); context.moveTo(s.points[0][0], s.points[0][1]);
    for (var j = 1; j < s.points.length; j++) context.lineTo(s.points[j][0], s.points[j][1]);
    context.stroke();
  }
  // Draws every stroke again (after Undo or Clear, and when the form opens)
  function redraw(){
    context.clearRect(0, 0, width, height);
    for (var j = 0; j < strokes.length; j++) drawStroke(strokes[j]);
  }
  // Keeps the strokes in the hidden input, so they are saved with the form
  function save(){
    var text = writeStrokes(strokes);
    store.value = text; store.setAttribute('value', text);
    if (typeof setDirtyFlag === 'function') setDirtyFlag();
  }
  // Where a pointer is in the area's pixels (whatever the page's zoom)
  function pointAt(e){
    var box = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - box.left) * width / box.width), Math.round((e.clientY - box.top) * height / box.height)];
  }
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    stroke = { color: pen, points: [pointAt(e)] }; strokes.push(stroke); drawStroke(stroke);
  });
  canvas.addEventListener('pointermove', function(e){
    if (!stroke) return;
    // (a point only once the pen has moved 2px, so a stroke keeps few)
    var point = pointAt(e), last = stroke.points[stroke.points.length - 1];
    if (Math.abs(point[0] - last[0]) + Math.abs(point[1] - last[1]) < 2) return;
    stroke.points.push(point);
    context.strokeStyle = stroke.color; context.beginPath(); context.moveTo(last[0], last[1]); context.lineTo(point[0], point[1]); context.stroke();
  });
  // (a stroke ends when the pen lifts or leaves)
  var endStroke = function(){ if (stroke){ stroke = null; save(); } };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  var tools = document.querySelector('[data-draw-tools-for="' + name + '"]');
  if (tools) tools.addEventListener('click', function(e){
    var button = e.target;
    if (button.getAttribute('data-draw-pen')){
      pen = button.getAttribute('data-draw-pen');
      var pens = tools.querySelectorAll('[data-draw-pen]');
      for (var j = 0; j < pens.length; j++) pens[j].style.border = pens[j] === button ? '2px solid #333' : '1px solid #999';
    }
    if (button.getAttribute('data-draw-tool') === 'undo' && strokes.length){ strokes.pop(); redraw(); save(); }
    if (button.getAttribute('data-draw-tool') === 'clear' && strokes.length && confirm('Clear this drawing?')){ strokes = []; redraw(); save(); }
  });
  redraw();
}
// The strokes kept in a free draw area's input, read back ("#000000|10,20 14,26;…"); what can't
// be read is left out
function readStrokes(text){
  var strokes = [], parts = String(text || '').split(';');
  for (var i = 0; i < parts.length; i++){
    var bar = parts[i].indexOf('|'); if (bar < 0) continue;
    var color = parts[i].slice(0, bar), points = [], pairs = parts[i].slice(bar + 1).split(' ');
    if (!/^#[0-9a-fA-F]{6}$/.test(color)) continue;
    for (var j = 0; j < pairs.length; j++){
      var xy = pairs[j].split(',');
      if (xy.length === 2 && isFinite(xy[0]) && isFinite(xy[1]) && xy[0] !== '' && xy[1] !== '') points.push([Number(xy[0]), Number(xy[1])]);
    }
    if (points.length) strokes.push({ color: color, points: points });
  }
  return strokes;
}
// Strokes written for a free draw area's input: "#000000|10,20 14,26;#d00000|…"
function writeStrokes(strokes){
  var parts = [];
  for (var i = 0; i < strokes.length; i++){
    var points = [];
    for (var j = 0; j < strokes[i].points.length; j++) points.push(strokes[i].points[j].join(','));
    parts.push(strokes[i].color + '|' + points.join(' '));
  }
  return parts.join(';');
}
</script>

<script>
// Signatures: each signature (data-signature-for) is the provider's stamp, their
// signature image, one drawn by hand on its free draw canvas, or "Electronically signed"; its controls
// (data-signature-tools-for) choose which, and the choice is kept in its hidden input
// "<name>_choice", so the form opens as it was saved (a new form, with the stamp)
function setUpSignatures(){
  var signatures = document.querySelectorAll('[data-signature-for]');
  for (var i = 0; i < signatures.length; i++){
    var key = signatures[i].getAttribute('data-signature-for'), choice = document.getElementsByName(key + '_choice')[0];
    chooseSignature(key, choice && (choice.value === 'draw' || choice.value === 'electronic') ? choice.value : 'stamp');
  }
  var tools = document.querySelectorAll('[data-signature-tools-for]');
  for (var j = 0; j < tools.length; j++) tools[j].addEventListener('click', function(e){
    var kind = e.target.getAttribute('data-signature-choice');
    if (!kind) return;
    chooseSignature(this.getAttribute('data-signature-tools-for'), kind);
    if (typeof setDirtyFlag === 'function') setDirtyFlag();
  });
}
// Shows a signature as the stamp ('stamp'), as drawn ('draw') or as "Electronically signed"
// ('electronic'), keeps the choice, and marks it on its controls (Clear only while it is drawn)
function chooseSignature(key, kind){
  var signature = document.querySelector('[data-signature-for="' + key + '"]'); if (!signature) return;
  var stamp = signature.getElementsByTagName('img')[0], drawn = signature.querySelector('.FreeDraw'), electronic = signature.querySelector('.SignatureElectronic');
  if (stamp) stamp.style.visibility = kind === 'stamp' ? '' : 'hidden';
  if (drawn) drawn.style.visibility = kind === 'draw' ? 'visible' : 'hidden';
  if (electronic) electronic.style.visibility = kind === 'electronic' ? 'visible' : 'hidden';
  var choice = document.getElementsByName(key + '_choice')[0];
  if (choice){ choice.value = kind; choice.setAttribute('value', kind); }
  var tools = document.querySelector('[data-signature-tools-for="' + key + '"]'); if (!tools) return;
  var choices = tools.querySelectorAll('[data-signature-choice]');
  for (var i = 0; i < choices.length; i++) choices[i].style.fontWeight = choices[i].getAttribute('data-signature-choice') === kind ? 'bold' : 'normal';
  var clear = tools.querySelector('[data-draw-tool="clear"]');
  if (clear) clear.style.visibility = kind === 'draw' ? '' : 'hidden';
}
</script>

<script>
// Validation groups: fields that must be filled in before the form is submitted. A group's rule
// is "all" (each of its fields filled in) or "one" (exactly one of them: one box ticked or
// circled, or one field filled in). A group not met only warns: the form may be submitted
// anyway. "exclusive" takes the tick or circle off a group's other boxes when one is ticked or
// circled.
var validationGroups = [{"name":"Smoker","rule":"one","message":"Choose exactly one of: Yes, No","exclusive":true,"fields":["smoker_yes_42","smoker_no_43"]},{"name":"Side","rule":"one","message":"Circle one side.","exclusive":true,"fields":["side_left_44","side_right_45","side_bilateral_46"]},{"name":"Referral details","rule":"all","message":"Fill in: Reason for referral, Requested by (required)","exclusive":true,"fields":["reason_47","requested_by_48"]},{"name":"Follow-up","rule":"one","message":"Choose exactly one of: Yes, No","exclusive":true,"fields":["followup_yes_55","followup_no_56"]},{"name":"Result","rule":"one","message":"Circle one result.","exclusive":true,"fields":["result_normal_57","result_abnormal_58"]}];
// (set once the form has been checked on the way to submitting, so the Submit button that
// follows doesn't check it again)
var requiredChecked = false;
// Whether a field has something in it: typed text, a tick box's X or a circle's O
function isFilled(box){ return !!box && String(box.value || '').replace(/^\s+|\s+$/g, '') !== ''; }
// A group's fields on the form
function groupBoxes(group){
  var boxes = [];
  for (var i = 0; i < group.fields.length; i++){ var box = document.getElementById(group.fields[i]); if (box) boxes.push(box); }
  return boxes;
}
// Whether a group's rule holds
function groupMet(group){
  var boxes = groupBoxes(group), filled = 0;
  for (var i = 0; i < boxes.length; i++) if (isFilled(boxes[i])) filled++;
  return group.rule === 'one' ? filled === 1 : filled === boxes.length;
}
// Outlines in red the fields a group still needs (all of an "exactly one" group's, the empty
// ones of an "all" group's), or takes the outline away
function markGroup(group, missing){
  var boxes = groupBoxes(group);
  for (var i = 0; i < boxes.length; i++){
    var show = missing && (group.rule === 'one' || !isFilled(boxes[i]));
    boxes[i].className = boxes[i].className.replace(/\s*RequiredMissing/g, '') + (show ? ' RequiredMissing' : '');
  }
  group.marked = missing;
}
// Checks every group before the form is submitted, outlines what is missing and says which

    if (met) continue;

  }

  try { if (first) first.scrollIntoView({ block: 'center' }); } catch(e){ try { first.scrollIntoView(); } catch(e2){} }

// toolbar, send the form without going through Submit: the form is checked first. (Listening in
// the capture phase, this runs before the button's own onclick, and on Cancel stops it; OSCAR's
// other fax buttons, "Add Other Fax Recipient", go on unchecked)
document.addEventListener('click', function(e){
  var button = e.target;
  if (!button || (button.id !== 'faxSave_button' && button.id !== 'fax_button')) return;

// On load: a group's red outline goes once its rule holds, and in an "exactly one" group that
// is exclusive, ticking or circling one of its boxes takes the tick or circle off the others
function setUpValidation(){
  for (var i = 0; i < validationGroups.length; i++){
    var boxes = groupBoxes(validationGroups[i]);
    for (var j = 0; j < boxes.length; j++) watchBox(validationGroups[i], boxes[j]);

// Watches one of a group's fields for a change (after its own click handler has ticked it)
function watchBox(group, box){
  var isToggle = function(b){ return /xMarkOnly|circleToggle/.test(b.className); };
  var changed = function(){
    if (group.rule === 'one' && group.exclusive && isToggle(box) && isFilled(box)){

      for (var k = 0; k < boxes.length; k++){ if (boxes[k] !== box && isToggle(boxes[k])){ boxes[k].value = ''; boxes[k].setAttribute('value', ''); } }
    }
    if (group.marked) markGroup(group, !groupMet(group));

  for (var e = 0; e < events.length; e++) box.addEventListener(events[e], changed);
