<script>
$(document).ready(function() {
  $('[class^="child-"]').hide();
  $('.parent-field').click(function() {
    $('[class^="child-"]').hide();
    $('.parent-field').each(function() {
      if ($(this).is('input:checkbox')) {
        if (this.checked) $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
      if ($(this).is('input:text')) {
        if ($(this).val() === 'X') $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
    });
  });
  $('[class^="only-one-"]').click(function() {
    if ($(this).is('input:checkbox')) {
      $('.' + $(this).attr('class')).prop('checked', false);
      $(this).prop('checked', true);
    }
    if ($(this).is('input:text')) {
      $('.' + $(this).attr('class')).val('');
      $(this).val('X');
    }
  });
});
</script>

<script>
function formPrint(){ try{ window.print(); }catch(e){} }

var needToConfirm = false;
document.onkeyup = setDirtyFlag;
function setDirtyFlag(){ needToConfirm = true; }
function releaseDirtyFlag(){ needToConfirm = false; }
window.onbeforeunload = confirmExit;
function confirmExit(){
  if (needToConfirm){
    return "You have attempted to leave this page. If you have made any changes to the fields without clicking the Save button, your changes will be lost. Are you sure you want to exit this page?";
  }
}
if (typeof window.setFaxNo !== 'function') window.setFaxNo = function(){};
if (typeof window.checkGender !== 'function') window.checkGender = function(){};
if (typeof window.loadSig !== 'function') window.loadSig = function(){};

function SignForm() {
  try {
    var provNum = $('#current_user_id').val();
    var sig = document.getElementById('signature');
    if (!sig) return;
    sig.src = "../eform/displayImage.do?imagefile=consult_sig_" + provNum + ".png";
    $('#signature').on('error', function() {
      $(this).hide();
    });
    sig.alt = provNum;
  } catch(e){}
}
function getFaxTargetNo(){
  var ids = ['faxNo','faxno','fax_number','faxnumber','otherFax','toFax'];
  for (var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if (!el) continue;
    var v = (el.value || '').trim();
    if (v) return v;
  }
  return '';
}
function syncFaxNoMirror(){
  var v = getFaxTargetNo();
  var h = document.getElementById('faxnumber');
  if (h) h.value = v;
}
function primeFaxNo(){
  try{
    var box = document.getElementById('faxNo');
    if (!box || (box.value && box.value.trim())) { syncFaxNoMirror(); return; }
    var candidates = ['clinic_fax','referral_fax','family_doctor_fax','current_user_fax','fax'];
    for (var i=0;i<candidates.length;i++){
      var el = document.getElementById(candidates[i]);
      if (!el) continue;
      var v = (el.value || '').trim();
      if (v){ box.value = v; break; }
    }
    syncFaxNoMirror();
  }catch(e){}
}
function formFax(){
  try{
    syncFaxNoMirror();
    var faxNo = getFaxTargetNo();
    if (typeof popupPage === 'function') { popupPage('fax', faxNo || ''); return; }
    if (typeof onEformFax === 'function') { onEformFax(faxNo || ''); return; }
    if (typeof setFaxNo === 'function') { setFaxNo(); }
    var fc = document.getElementById('faxControl');
    if (fc){
      fc.style.display = 'inline-block';
      if (fc.children && fc.children.length) return;
    }
    alert('Fax control not available in this context.');
  }catch(e){ alert('Fax control not available in this context.'); }
}
function formSubmitAndFax(){
  try{ primeFaxNo(); }catch(e){}
  try{ formFax(); }catch(e){}
  try{ releaseDirtyFlag(); }catch(e){}
  setTimeout(function(){ var b=document.getElementById('SubmitButton'); if(b) b.click(); }, 350);
}
</script>
