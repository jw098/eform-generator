$(document).ready(function() {
  $('[class^="child-"]').hide();
  $('.parent-field').click(function() {
    $('[class^="child-"]').hide();
    $('.parent-field').each(function() {
      if ($(this).is('input:checkbox')) {
        if (this.checked) $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
      if ($(this).is('input:text')) {
        if ($(this).val() === 'X') $('.child-' + $(this).prop('id')).show();
        else $('.child-' + $(this).val()).show();
      }
    });
  });
  $('[class^="only-one-"]').click(function() {
    if ($(this).is('input:checkbox')) {
      $('.' + $(this).attr('class')).prop('checked', false);
      $(this).prop('checked', true);
    }
    if ($(this).is('input:text')) {
      $('.' + $(this).attr('class')).val('');
      $(this).val('X');
    }
  });
});
</script>

<script>
// "Print & Submit": prints the form
function formPrint(){ try{ window.print(); }catch(e){} }

// Typing in the form marks it changed, so leaving asks first; submitting clears that
var needToConfirm = false;
document.onkeyup = setDirtyFlag;
function setDirtyFlag(){ needToConfirm = true; }
function releaseDirtyFlag(){ needToConfirm = false; }
window.onbeforeunload = confirmExit;
// The warning shown on leaving a changed form
function confirmExit(){
  if (needToConfirm){
    return "You have attempted to leave this page. If you have made any changes to the fields without clicking the Save button, your changes will be lost. Are you sure you want to exit this page?";
  }
}
if (typeof window.setFaxNo !== 'function') window.setFaxNo = function(){};
if (typeof window.checkGender !== 'function') window.checkGender = function(){};
if (typeof window.loadSig !== 'function') window.loadSig = function(){};

// Shows the current provider's signature image in the signature stamp (hidden if they have none)
function SignForm() {
  try {
    var provNum = $('#current_user_id').val();
    var sig = document.getElementById('signature');
    if (!sig) return;
    sig.src = "../eform/displayImage.do?imagefile=consult_sig_" + provNum + ".png";
    $('#signature').on('error', function() {
      $(this).hide();
    });
    sig.alt = provNum;
  } catch(e){}
}
// The fax number to send to: the first filled-in fax number field on the form
function getFaxTargetNo(){
  var ids = ['faxNo','faxno','fax_number','faxnumber','otherFax','toFax'];
  for (var i=0;i<ids.length;i++){
    var input = document.getElementById(ids[i]);
    if (!input) continue;
    var faxNo = (input.value || '').trim();
    if (faxNo) return faxNo;
  }
  return '';
}
// Copies the fax number into the hidden faxnumber field that OSCAR sends with the form
function syncFaxNoMirror(){
  var faxNo = getFaxTargetNo();
  var hiddenFaxNo = document.getElementById('faxnumber');
  if (hiddenFaxNo) hiddenFaxNo.value = faxNo;
}
// Fills an empty faxNo field from the clinic's, referral's or provider's fax number, when the
// form has one of those
function primeFaxNo(){
  try{
    var faxNoBox = document.getElementById('faxNo');
    if (!faxNoBox || (faxNoBox.value && faxNoBox.value.trim())) { syncFaxNoMirror(); return; }
    var candidates = ['clinic_fax','referral_fax','family_doctor_fax','current_user_fax','fax'];
    for (var i=0;i<candidates.length;i++){
      var input = document.getElementById(candidates[i]);
      if (!input) continue;
      var faxNo = (input.value || '').trim();
      if (faxNo){ faxNoBox.value = faxNo; break; }
    }
    syncFaxNoMirror();
  }catch(e){}
}
// Opens OSCAR's fax, whichever way this OSCAR offers it (faxControl.js's control on older ones)
function formFax(){
  try{
    syncFaxNoMirror();
    var faxNo = getFaxTargetNo();
    if (typeof popupPage === 'function') { popupPage('fax', faxNo || ''); return; }
    if (typeof onEformFax === 'function') { onEformFax(faxNo || ''); return; }
    if (typeof setFaxNo === 'function') { setFaxNo(); }
    var faxControl = document.getElementById('faxControl');
    if (faxControl){
      faxControl.style.display = 'inline-block';
      if (faxControl.children && faxControl.children.length) return;
    }
    alert('Fax control not available in this context.');
  }catch(e){ alert('Fax control not available in this context.'); }
}
// "Fax & Submit": fills in the fax number, faxes, then submits the form
function formSubmitAndFax(){
  try{ primeFaxNo(); }catch(e){}
  try{ formFax(); }catch(e){}
  try{ releaseDirtyFlag(); }catch(e){}
  setTimeout(function(){ var submitBtn=document.getElementById('SubmitButton'); if(submitBtn) submitBtn.click(); }, 350);
}
</script>
